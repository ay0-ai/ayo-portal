name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Prepare apps.json
        run: echo '${{ env.APPS_JSON }}' | base64 -w 0 > /tmp/apps_json_base64
        env:
          APPS_JSON: |
            [{"url": "https://github.com/${{ github.repository }}", "branch": "${{ github.ref_name }}"}]

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            FRAPPE_VERSION=develop
            APPS_JSON_BASE64=${{ steps.prepare-apps.outputs.apps_json_base64 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: azure/aks-set-context@v4
        with:
          resource-group: resource-ayo-ai
          cluster-name: ayo-aks

      - uses: azure/setup-helm@v4

      - name: Deploy
        run: |
          helm upgrade --install ayo-portal \
            infra/charts/ayo-portal \
            -f infra/values/ayo-portal/prd.yaml \
            --set image.tag=${{ github.sha }} \
            --set postgresql.host=${{ secrets.PG_HOST }} \
            --set postgresql.rootPassword=${{ secrets.PG_PASSWORD }} \
            --set redis.host=${{ secrets.REDIS_HOST }} \
            --set redis.password=${{ secrets.REDIS_PASSWORD }} \
            --set adminPassword=${{ secrets.ADMIN_PASSWORD }} \
            --wait --timeout 300s
