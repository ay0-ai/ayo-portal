siteName: erp.ayo.ai

backend:
  replicas: 1
  gunicorn:
    workers: 2
    threads: 4
    timeout: 120

frontend:
  replicas: 1

websocket:
  replicas: 1

worker:
  replicas: 1

scheduler:
  replicas: 1

persistence:
  sites:
    size: 10Gi

ingress:
  enabled: true
  className: nginx
  host: erp.ayo.ai
  tls:
    enabled: true
    secretName: erp-ayo-ai-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
