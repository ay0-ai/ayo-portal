apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ayo-portal.fullname" . }}-websocket
  labels:
    {{- include "ayo-portal.labels" . | nindent 4 }}
    app.kubernetes.io/component: websocket
spec:
  replicas: {{ .Values.websocket.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ayo-portal.name" . }}
      app.kubernetes.io/component: websocket
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ayo-portal.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: websocket
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: websocket
          image: {{ include "ayo-portal.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
          ports:
            - containerPort: 9000
              name: ws
          resources:
            {{- toYaml .Values.websocket.resources | nindent 12 }}
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: {{ include "ayo-portal.fullname" . }}-sites
