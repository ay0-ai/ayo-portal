apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ayo-portal.fullname" . }}-frontend
  labels:
    {{- include "ayo-portal.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ayo-portal.name" . }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ayo-portal.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: frontend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ include "ayo-portal.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["nginx-entrypoint.sh"]
          env:
            - name: BACKEND
              value: {{ include "ayo-portal.fullname" . }}-backend:8000
            - name: SOCKETIO
              value: {{ include "ayo-portal.fullname" . }}-websocket:9000
            - name: FRAPPE_SITE_NAME_HEADER
              value: {{ .Values.siteName | quote }}
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: {{ include "ayo-portal.fullname" . }}-sites
