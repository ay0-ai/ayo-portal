# Init script that writes common_site_config.json and creates the site if it doesn't exist
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ayo-portal.fullname" . }}-configurator
  labels:
    {{- include "ayo-portal.labels" . | nindent 4 }}
data:
  configure.sh: |
    #!/bin/bash
    set -e

    cd /home/frappe/frappe-bench

    # Write apps.txt from installed apps
    ls -1 apps > sites/apps.txt

    # Configure DB and Redis
    bench set-config -g db_host "$DB_HOST"
    bench set-config -gp db_port "$DB_PORT"
    bench set-config -g redis_cache "$REDIS_URL"
    bench set-config -g redis_queue "$REDIS_URL"
    bench set-config -g redis_socketio "$REDIS_URL"

    # Create site if it doesn't exist
    if [ ! -f "sites/${SITE_NAME}/site_config.json" ]; then
      echo "Creating site ${SITE_NAME}..."
      bench new-site "${SITE_NAME}" \
        --db-type postgres \
        --db-host "$DB_HOST" \
        --db-port "$DB_PORT" \
        --db-root-username "$DB_ROOT_USER" \
        --db-root-password "$DB_ROOT_PASSWORD" \
        --admin-password "$ADMIN_PASSWORD" \
        --install-app erpnext
    else
      echo "Site ${SITE_NAME} already exists, running migrate..."
      bench --site "${SITE_NAME}" migrate
    fi

    echo "Configuration complete."
