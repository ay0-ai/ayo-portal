apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ayo-portal.fullname" . }}-backend
  labels:
    {{- include "ayo-portal.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ayo-portal.name" . }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ayo-portal.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "ayo-portal.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - gunicorn
            - --bind=0.0.0.0:8000
            - --workers={{ .Values.backend.gunicorn.workers }}
            - --threads={{ .Values.backend.gunicorn.threads }}
            - --worker-class=gthread
            - --timeout={{ .Values.backend.gunicorn.timeout }}
            - --preload
            - frappe.app:application
          ports:
            - containerPort: 8000
              name: http
          livenessProbe:
            httpGet:
              path: /api/method/ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/method/ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: {{ include "ayo-portal.fullname" . }}-sites
