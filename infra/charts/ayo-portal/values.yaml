image:
  repository: ghcr.io/ay0-ai/ayo-portal
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

siteName: erp.ayo.ai
adminPassword: ""

# External PostgreSQL
postgresql:
  host: ""
  port: 5432
  rootUser: ayoadmin
  rootPassword: ""

# External Redis
redis:
  host: ""
  port: 6379
  password: ""

backend:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  gunicorn:
    workers: 2
    threads: 4
    timeout: 120

frontend:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

websocket:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

worker:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

scheduler:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

persistence:
  sites:
    size: 5Gi
    storageClass: ""

ingress:
  enabled: true
  className: nginx
  host: erp.ayo.ai
  tls:
    enabled: true
    secretName: erp-ayo-ai-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
